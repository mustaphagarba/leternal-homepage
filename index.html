<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leternal Inc | Systems and Academy</title>
<meta name="description" content="Leternal Inc: Leternal Systems builds digital products for businesses; Leternal Academy trains kids and teens in tech. Abuja, Lagos, Nigeria.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--g:#296F39;--gd:#1A572E;--ga:#7AB769;--bg:#faf8f5;--sf:#fff;--tx:#2b2a28;--mu:#5e5a55;--bd:#e3ded7;--wg:#efebe5;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#7AB769;--gd:#9ad087;--bg:#16201a;--sf:#1e2b23;--tx:#eceae5;--mu:#b5b1aa;--bd:#33443a;--wg:#243229;--on:#10190f}}
:root[data-theme="dark"]{--g:#7AB769;--gd:#9ad087;--bg:#16201a;--sf:#1e2b23;--tx:#eceae5;--mu:#b5b1aa;--bd:#33443a;--wg:#243229;--on:#10190f}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.55 "Crimson Text",Georgia,serif;min-height:100%}
h1,h2,h3{font-family:Merriweather,Georgia,serif;line-height:1.25;color:var(--gd);margin:0 0 .6rem}
h1{font-size:clamp(1.7rem,5vw,2.6rem)}h2{font-size:1.5rem}h3{font-size:1.15rem}
a{color:var(--g)}p{margin:0 0 1rem}
.w{max-width:1040px;margin:0 auto;padding:0 1.1rem}
header{background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;padding:.7rem 0}
.brand{font:700 1.15rem Merriweather,Georgia,serif;color:var(--gd);text-decoration:none;margin-right:auto}
nav{display:flex;flex-wrap:wrap;gap:.2rem}
nav a{padding:.35rem .7rem;border-radius:99px;text-decoration:none;color:var(--tx);font-size:.95rem}
nav a[aria-current=page]{background:var(--g);color:var(--on)}
nav a:focus-visible,.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ga);outline-offset:2px}
.sw{display:flex;gap:.3rem;font-size:.9rem;width:100%}
.sw a{flex:1;text-align:center;padding:.4rem;border:1px solid var(--bd);border-radius:8px;text-decoration:none;color:var(--tx)}
.sw a.on{border-color:var(--g);background:var(--wg);font-weight:600}
@media(min-width:760px){.sw{width:auto}.sw a{flex:none;padding:.35rem .9rem}}
section{padding:2.2rem 0}
.hero{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:3rem 0}
.hero h1{color:#fff}.hero p{max-width:40rem;font-size:1.2rem}
.hero.ac{border-radius:0 0 2rem 2rem}
.btn{display:inline-block;background:var(--g);color:var(--on);padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font:600 1rem "Crimson Text",serif;border:0;cursor:pointer}
.hero .btn{background:#fff;color:#1A572E;margin:.3rem .5rem .3rem 0}
.btn.o{background:transparent;color:var(--g);border:2px solid var(--g)}
.hero .btn.o{color:#fff;border-color:#fff;background:transparent}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:1.1rem}
.ac-c .card{border-radius:20px}
.tag{display:inline-block;background:var(--wg);border-radius:99px;padding:.05rem .6rem;font-size:.85rem;margin:0 .3rem .3rem 0;color:var(--mu)}
.fl{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem}
.fl button{border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:99px;padding:.3rem .85rem;font:inherit;font-size:.95rem;cursor:pointer}
.fl button[aria-pressed=true]{background:var(--g);color:var(--on);border-color:var(--g)}
.ph{aspect-ratio:16/9;border-radius:8px;background:repeating-linear-gradient(45deg,var(--wg),var(--wg) 10px,var(--bd) 10px,var(--bd) 11px);display:grid;place-items:center;color:var(--mu);font-size:.9rem;margin-bottom:.8rem}
.mu{color:var(--mu)}.note{font-size:.9rem;color:var(--mu);border-left:3px solid var(--ga);padding-left:.7rem}
form{display:grid;gap:.9rem;max-width:620px}
label{display:grid;gap:.25rem;font-weight:600;font-size:.95rem}
input,select,textarea{font:inherit;padding:.55rem;border:1px solid var(--mu);border-radius:8px;background:var(--sf);color:var(--tx);width:100%}
.ck{display:flex;gap:.6rem;align-items:flex-start;font-weight:400}.ck input{width:auto;margin-top:.35rem}
.hp{position:absolute;left:-9999px}
.ok{background:var(--wg);border:1px solid var(--g);border-radius:10px;padding:1rem}
ol.s{padding-left:1.2rem}ol.s li{margin-bottom:.4rem}
footer{background:var(--gd);color:#e9f2ea;padding:2rem 0;margin-top:2rem}
footer a{color:#fff}footer .w{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script>
const {useState,useEffect}=React;const html=htm.bind(React.createElement);

/* Content records: edit here to add projects, tracks and events without touching the layout. */
const D={
projects:[
{n:"OmniVerify",c:"Leternal Systems (own product)",y:2026,t:"data",s:"Unified product verification platform for NAFDAC and SON checks.",tags:["Product","Verification","PWA"],problem:"Consumers and regulators check product authenticity across separate channels.",approach:"One platform with a camera-scanning web app and a single verification record.",outcome:"Add a measurable result here once the pilot reports.",tech:"React, Postgres, PWA"},
{n:"Startup Kano Centre For Innovation",c:"Confidential client",y:2026,t:"systems",s:"Web presence for innovation hub in Northern Nigeria",tags:["Anonymised","Startup"],problem:"Modernise Startup Kano's web presence with lightweight site",approach:"Phased MVP",outcome:"Reduced website load times by 27%",tech:"PHP"},
{n:"Cinema showtimes aggregator",c:"Internal build",y:2026,t:"web",s:"Showtimes for Abuja cinemas gathered in one searchable place.",tags:["Web","Data"],problem:"Showtimes are scattered across cinema sites.",approach:"Scheduled collection into one database with a simple web front end.",outcome:"Add a measurable result here.",tech:"Next.js, Postgres"}],
types:["all","web","mobile","systems","data","other"],
tracks:[
{id:1,a:"Kids",f:"Scratch",fm:"8 weeks, longer sessions",g:["kids"]},
{id:2,a:"Teens",f:"Python basics",fm:"Class-based",g:["teens"]},
{id:3,a:"Teens",f:"3D design",fm:"8 weeks, longer sessions",g:["teens"]},
{id:4,a:"Kids",f:"Robotics (Arduino and parts)",fm:"Every-other-day summer camp, reduced difficulty",g:["kids","summer camp"]},
{id:5,a:"Teens",f:"Robotics",fm:"8 weeks, longer sessions",g:["teens"]},
{id:6,a:"Teens (intermediate/advanced)",f:"Advanced Python, building on Track 2",fm:"4 hours per class, 8 Saturdays",g:["teens","weekend"]}],
events:[
{n:"Summer Camp 2025",se:"summer",y:2025,tr:[4],loc:"Location to be confirmed",d:"Dates to be confirmed",l:"Number to be confirmed",p:"Short description of the camp goes here."},
{n:"Christmas Camp 2025",se:"christmas",y:2025,tr:[1,2],loc:"Location to be confirmed",d:"Dates to be confirmed",l:"Number to be confirmed",p:"Short description of the camp goes here."}]
};
const services=["Web and mobile build","Digital products (such as OmniVerify)","Data tools","Systems integration","Training support","Leternal Academy: general enquiry","Leternal Academy: track enquiry"];

const routes={home:"Home",systems:"Overview","systems-portfolio":"Portfolio","systems-value":"Value Proposition","systems-contact":"Contact",academy:"Overview","academy-training":"Training Offered","academy-previous":"Previous Training","academy-contact":"Contact"};
const getR=()=>{const h=location.hash.slice(1);return routes[h]?h:"home"};
const sec=r=>r.startsWith("systems")?"systems":r.startsWith("academy")?"academy":"home";
const titles={home:"Leternal Inc",systems:"Leternal Systems",academy:"Leternal Academy"};

function Header({r}){const s=sec(r);
const items=Object.keys(routes).filter(k=>k!=="home"&&sec(k)===s);
return html`<header><div class="w bar"><a class="brand" href="#home">Leternal Inc</a>
<div class="sw" role="group" aria-label="Division"><a href="#home" class=${s==="home"?"on":""}>Home</a><a href="#systems" class=${s==="systems"?"on":""}>Systems</a><a href="#academy" class=${s==="academy"?"on":""}>Academy</a></div>
${s!=="home"&&html`<nav aria-label=${titles[s]}>${items.map(k=>html`<a key=${k} href=${"#"+k} aria-current=${k===r?"page":undefined}>${routes[k]}</a>`)}</nav>`}</div></header>`}

function Hero({h,p,children,ac}){return html`<div class=${"hero"+(ac?" ac":"")}><div class="w"><h1>${h}</h1><p>${p}</p>${children}</div></div>`}

function Home(){return html`<${Hero} h="Digital products and tech skills, from one accountable team." p="Leternal Inc brings together a digital agency and a training academy. Choose the side you need."><a class="btn" href="#systems">Explore Leternal Systems</a><a class="btn o" href="#academy">Explore Leternal Academy</a><//>
<section><div class="w"><div class="grid">
<div class="card"><div class="ph" role="img" aria-label="Placeholder for a Leternal Systems project image">Image: Systems</div><h2>Leternal Systems</h2><p>Web, mobile, data and integration work for businesses that need software that holds up.</p><a href="#systems">Visit Systems →</a></div>
<div class="card"><div class="ph" role="img" aria-label="Placeholder for a Leternal Academy class image">Image: Academy</div><h2>Leternal Academy</h2><p>Hands-on classes and camps in Scratch, Python, 3D design and robotics for kids and teens.</p><a href="#academy">Visit Academy →</a></div></div></div></section>
<section><div class="w"><h2>About Leternal Inc</h2><p>Leternal Inc is the parent brand of Leternal Systems and Leternal Academy. Both divisions share one team, one standard of delivery and one address for questions.</p></div></section>`}

function SysHome(){const hl=["Web and mobile products","Digital products built in-house","Data and analytics tools","Systems integration"];
return html`<${Hero} h="Software built to work in the real world." p="Leternal Systems designs, builds and supports digital products for organisations in Nigeria."><a class="btn" href="#systems-contact">Start a conversation</a><//>
<section><div class="w"><h2>What we deliver</h2><div class="grid">${hl.map(x=>html`<div class="card" key=${x}><h3>${x}</h3></div>`)}</div></div></section>
<section><div class="w"><h2>Selected work</h2><div class="grid">${D.projects.slice(0,3).map(p=>html`<div class="card" key=${p.n}><h3>${p.n}</h3><p>${p.s}</p>${p.tags.map(t=>html`<span class="tag" key=${t}>${t}</span>`)}</div>`)}</div><p style=${{marginTop:"1rem"}}><a href="#systems-portfolio">See the full portfolio →</a></p></div></section>`}

function Portfolio(){const[f,setF]=useState("all");const[o,setO]=useState(null);
const list=D.projects.filter(p=>f==="all"||p.t===f);
return html`<section><div class="w"><h1>Portfolio</h1>
<p class="note">Sample entries. Replace with cleared projects; clients who cannot be named stay anonymised.</p><br/>
<div class="fl" role="group" aria-label="Filter by type">${D.types.map(t=>html`<button key=${t} aria-pressed=${f===t} onClick=${()=>setF(t)}>${t==="all"?"All":t[0].toUpperCase()+t.slice(1)}</button>`)}</div>
<div class="grid">${list.map(p=>html`<article class="card" key=${p.n}><h3>${p.n}</h3><p class="mu">${p.c} · ${p.y}</p><p>${p.s}</p>${p.tags.map(t=>html`<span class="tag" key=${t}>${t}</span>`)}
<div><button class="btn o" aria-expanded=${o===p.n} onClick=${()=>setO(o===p.n?null:p.n)}>${o===p.n?"Hide details":"View details"}</button></div>
${o===p.n&&html`<div style=${{marginTop:".8rem"}}><p><b>Problem:</b> ${p.problem}</p><p><b>Approach:</b> ${p.approach}</p><p><b>Outcome:</b> ${p.outcome}</p><p><b>Technologies:</b> ${p.tech}</p></div>`}</article>`)}</div>
${!list.length&&html`<p>No projects of this type yet.</p>`}</div></section>`}

function Value(){const g=[["Web and mobile build","Responsive sites and apps, mobile first."],["Digital products","Products such as OmniVerify, built and run by us."],["Data tools","Dashboards and analytics that answer real questions."],["Systems integration","Connecting the systems you already depend on."],["Training support","Upskilling your team through Leternal Academy."]];
return html`<section><div class="w"><h1>Value Proposition</h1><h2>Services</h2><div class="grid">${g.map(([a,b])=>html`<div class="card" key=${a}><h3>${a}</h3><p>${b}</p></div>`)}</div>
<h2 style=${{marginTop:"2rem"}}>Why Leternal</h2><p class="note">Draft differentiators. Replace each with a verifiable proof point.</p><ul><li>We ship working products of our own, such as OmniVerify, so we know the full cycle.</li><li>One team across build, handover and support, with a named lead on every project.</li><li>Mobile-first, accessible and fast on 4G by default.</li></ul>
<h2>How we work</h2><ol class="s"><li><b>Discovery:</b> goals, users, constraints.</li><li><b>Proposal:</b> scope, timeline, cost.</li><li><b>Build:</b> short cycles with regular demos.</li><li><b>Handover:</b> documentation and training.</li><li><b>Support:</b> agreed response times after launch.</li></ol></div></section>`}

function ContactForm({academy}){const[sent,setSent]=useState(false);const[kind,setKind]=useState(academy?"Leternal Academy: track enquiry":services[0]);const reg=kind==="Register interest for next cohort";
const opts=academy?["Leternal Academy: general enquiry","Leternal Academy: track enquiry","Register interest for next cohort"]:services;
useEffect(()=>setKind(opts[academy?1:0]),[academy]);
const sub=e=>{e.preventDefault();const d=new FormData(e.target);if(d.get("website"))return;/* honeypot */ setSent(true)};
if(sent)return html`<div class="ok" role="status"><h3>Thank you.</h3><p>Your message has been received. We will reply by email shortly. (Demo: connect this form to your email service or backend to deliver messages and the auto-reply.)</p></div>`;
return html`<form onSubmit=${sub}><label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"/></label>
<label>Name<input name="name" required autocomplete="name"/></label>
<label>${reg?"Guardian email":"Email"}<input name="email" type="email" required autocomplete="email"/></label>
${!reg&&!academy&&html`<label>Company<input name="company" autocomplete="organization"/></label>`}
<label>Phone (optional)<input name="phone" type="tel" autocomplete="tel"/></label>
<label>${academy?"Enquiry type":"Service of interest"}<select value=${kind} onChange=${e=>setKind(e.target.value)}>${opts.map(o=>html`<option key=${o}>${o}</option>`)}</select></label>
${(reg||kind.endsWith("track enquiry"))&&html`<label>Preferred track<select name="track">${D.tracks.map(t=>html`<option key=${t.id}>Track ${t.id}: ${t.f}</option>`)}</select></label>`}
${reg&&html`<label>Child's age group<select name="age"><option>Kids</option><option>Teens</option></select></label>`}
<label>Message<textarea name="message" rows="5" required></textarea></label>
<label class="ck"><input type="checkbox" required/> <span>I agree that Leternal may use these details to reply to me, as set out in the privacy notice.</span></label>
<div><button class="btn" type="submit">Send</button></div></form>`}

function Contact({academy}){return html`<section><div class="w"><h1>Contact</h1>
<p>Phone: <a href="tel:+2348138648116">+234 813 864 8116</a><br/>Email: <a href="mailto:info@leternal.ng">info@leternal.ng</a></p>
<${ContactForm} academy=${academy}/><p class="note" style=${{marginTop:"1.2rem"}}>Privacy notice: we collect only what is needed to reply, and for Academy enquiries, guardian contact details. We do not publish children's names.</p></div></section>`}

function AcHome(){return html`<${Hero} ac=${true} h="Where young people learn to build with technology." p="Leternal Academy runs classes and camps in Scratch, Python, 3D design and robotics."><a class="btn" href="#academy-training">See training offered</a><a class="btn o" href="#academy-contact">Register interest</a><//>
<section class="ac-c"><div class="w"><h2>Learn by making</h2><div class="grid"><div class="card"><h3>Kids</h3><p>Scratch and beginner robotics, with longer hands-on sessions.</p></div><div class="card"><h3>Teens</h3><p>Python, 3D design and robotics, up to advanced Python on Saturdays.</p></div><div class="card"><h3>Camps</h3><p>Summer and Christmas camps. <a href="#academy-previous">See what we have run →</a></p></div></div></div></section>`}

function Training(){const[f,setF]=useState("all");const fl=["all","kids","teens","summer camp","weekend"];
const list=D.tracks.filter(t=>f==="all"||t.g.includes(f));
return html`<section class="ac-c"><div class="w"><h1>Training Offered</h1>
<p class="note">Fees, start dates and cohort capacity are to be confirmed. Remove any track not currently offered.</p><br/>
<div class="fl" role="group" aria-label="Filter tracks">${fl.map(x=>html`<button key=${x} aria-pressed=${f===x} onClick=${()=>setF(x)}>${x==="all"?"All":x[0].toUpperCase()+x.slice(1)}</button>`)}</div>
<div class="grid">${list.map(t=>html`<article class="card" key=${t.id}><span class="tag">Track ${t.id}</span><h3>${t.f}</h3><p><b>Age group:</b> ${t.a}<br/><b>Format:</b> ${t.fm}<br/><b>Level and what learners build:</b> to be confirmed</p><a class="btn" href="#academy-contact">Enrol / Enquire</a></article>`)}</div></div></section>`}

function Previous(){const[se,setSe]=useState("all");const[y,setY]=useState("all");const[tr,setTr]=useState("all");
const list=D.events.filter(e=>(se==="all"||e.se===se)&&(y==="all"||String(e.y)===y)&&(tr==="all"||e.tr.includes(+tr)));
const Sel=({l,v,s,o})=>html`<label style=${{fontWeight:400}}>${l}<select value=${v} onChange=${e=>s(e.target.value)}>${o.map(x=>html`<option key=${x[0]} value=${x[0]}>${x[1]}</option>`)}</select></label>`;
return html`<section class="ac-c"><div class="w"><h1>Previous Training Conducted</h1>
<p class="note">Sample entries. Add photos only with written guardian consent; never publish children's full names or school names. To request removal, use the Contact page.</p><br/>
<div class="grid" style=${{marginBottom:"1.2rem"}}><${Sel} l="Season" v=${se} s=${setSe} o=${[["all","All"],["summer","Summer"],["christmas","Christmas"]]}/><${Sel} l="Year" v=${y} s=${setY} o=${[["all","All"],["2025","2025"]]}/><${Sel} l="Track" v=${tr} s=${setTr} o=${[["all","All"]].concat(D.tracks.map(t=>[String(t.id),"Track "+t.id+": "+t.f]))}/></div>
${list.map(e=>html`<article class="card" key=${e.n} style=${{marginBottom:"1rem"}}><h2>${e.n}</h2><p class="mu">${e.d} · ${e.loc}</p><p><b>Tracks taught:</b> ${e.tr.map(i=>"Track "+i).join(", ")}<br/><b>Learners:</b> ${e.l}</p><p>${e.p}</p>
<div class="grid" style=${{gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))"}}>${[1,2,3].map(i=>html`<div class="ph" key=${i} role="img" aria-label=${"Photo placeholder "+i+" for "+e.n}>Photo ${i}</div>`)}</div></article>`)}
${!list.length&&html`<p>No events match these filters.</p>`}</div></section>`}

function Footer(){return html`<footer><div class="w"><div><b>Leternal Inc</b><p>Leternal Systems and Leternal Academy<br/>www.leternal.ng</p></div><div><b>Contact</b><p><a href="tel:+2348138648116">+234 813 864 8116</a><br/><a href="mailto:info@leternal.ng">info@leternal.ng</a><br/>Address: to be added</p></div><div><b>Follow</b><p>Social links: to be added</p></div></div></footer>`}

const pages={home:Home,systems:SysHome,"systems-portfolio":Portfolio,"systems-value":Value,"systems-contact":()=>html`<${Contact}/>`,academy:AcHome,"academy-training":Training,"academy-previous":Previous,"academy-contact":()=>html`<${Contact} academy=${true}/>`};

function App(){const[r,setR]=useState(getR());
useEffect(()=>{const f=()=>{setR(getR());window.scrollTo(0,0)};addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
useEffect(()=>{document.title=(r==="home"?"Leternal Inc":titles[sec(r)]+" | "+routes[r])+" | Leternal"},[r]);
const P=pages[r];return html`<${Header} r=${r}/><main id="main"><${P}/></main><${Footer}/>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
